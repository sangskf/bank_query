name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            archive: zip
            test: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            suffix: .exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
            archive: tar.gz
            test: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ''
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ''
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
            archive: tar.gz
            test: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Install cross-compilation dependencies (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test (native target only)
        if: matrix.test == 'true'
        run: cargo test

      - name: Package binary
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $target = "${{ matrix.target }}"
          $bin = "bank_query${{ matrix.suffix }}"
          $src = "target/${target}/release/${bin}"
          if ("${{ matrix.archive }}" -eq "zip") {
            $zip = "bank_query-${tag}-${target}.zip"
            Compress-Archive -Path $src -DestinationPath $zip
            echo "ARTIFACT=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $tar = "bank_query-${tag}-${target}.tar.gz"
            tar -czf $tar -C "target/${target}/release" $bin
            echo "ARTIFACT=$tar" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
