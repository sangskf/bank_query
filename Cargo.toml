[package]
name = "bank_query"
version = "0.1.0"
edition = "2024"

[dependencies]
warp = "0.3"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_xlsxwriter = "0.79"
calamine = "0.26"
bytes = "1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
